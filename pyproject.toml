[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laplace-fm"
version = "0.1.0"
description = "Memory-conscious 3D LapFlow adaptation for DNS velocity generation"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24", "netCDF4>=1.6", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
include = ["lapflow*"]
